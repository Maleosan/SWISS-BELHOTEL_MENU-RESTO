<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flipbook</title>
    <style>
      /* Ensure full viewport coverage */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      /* Page Indicator */
      .page-indicator-container {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 14px;
        z-index: 1000;
        font-weight: 500;
        display: none;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }

      .page-indicator-container.visible {
        display: block;
      }

      /* "Buka Menu" Button - Cover Only */
      .buka-menu-button {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 32px;
        background: rgba(134, 59, 255, 0.8);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        z-index: 999;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 4px 15px rgba(134, 59, 255, 0.3);
        transition: all 0.3s ease;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .buka-menu-button.visible {
        opacity: 1;
        pointer-events: auto;
        visibility: visible;
      }

      .buka-menu-button:hover {
        background: rgba(134, 59, 255, 1);
        box-shadow: 0 6px 20px rgba(134, 59, 255, 0.5);
        transform: translateX(-50%) translateY(-2px);
      }

      .buka-menu-button:active {
        transform: translateX(-50%) translateY(0);
      }

      /* Ensure app container is centered and full viewport */
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Fix container centering */
      .container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0;
        margin: 0;
      }

      /* Responsive on mobile */
      @media (max-width: 768px) {
        .page-indicator-container {
          bottom: 10px;
          font-size: 12px;
          padding: 6px 12px;
        }

        .buka-menu-button {
          bottom: 60px;
          padding: 10px 24px;
          font-size: 14px;
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BpgPj50I.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C4GAkjxB.css">
  </head>
  <body>
    <div id="app"></div>
    
    <!-- "Buka Menu" Button - Cover Only -->
    <button class="buka-menu-button" id="bukaMenuBtn">Buka Menu</button>
    
    <!-- Page Indicator -->
    <div class="page-indicator-container" id="pageIndicator">
      <span id="currentPage">1</span> / <span id="totalPages">0</span>
    </div>

    <script>
      // Global reference for PageFlip
      let globalPageFlip = null;

      // Override console to capture if PageFlip is logged
      const originalLog = console.log;
      console.log = function(...args) {
        originalLog.apply(console, args);
        // Check if any arg is PageFlip-like
        args.forEach(arg => {
          if (arg && typeof arg === 'object' && (arg.flip || arg.getCurrentPageIndex)) {
            globalPageFlip = arg;
          }
        });
      };

      // Wait for app to render and PageFlip to initialize
      let attempts = 0;
      const maxAttempts = 100;

      function findPageFlip() {
        attempts++;
        
        if (attempts > maxAttempts) {
          console.error('Failed to find PageFlip instance after many attempts');
          return;
        }

        // Method 1: Check window
        if (window.pageFlip) {
          globalPageFlip = window.pageFlip;
        }

        // Method 2: Check if captured globally
        if (!globalPageFlip) {
          // Look for it in the DOM by finding element with flip capabilities
          const bookElement = document.querySelector('[class*="flip"], [data-flip], .book, #book, #flip');
          if (bookElement && bookElement.__pageFlip) {
            globalPageFlip = bookElement.__pageFlip;
          }
        }

        // Method 3: Wait for element to have pageFlip attached
        if (!globalPageFlip) {
          const appElement = document.getElementById('app');
          if (appElement) {
            // Try to find any child with pageFlip
            const walker = document.createTreeWalker(
              appElement,
              NodeFilter.SHOW_ELEMENT,
              null,
              false
            );
            let node;
            while (node = walker.nextNode()) {
              if (node.__pageFlip || (node.pageFlip && typeof node.pageFlip.flip === 'function')) {
                globalPageFlip = node.__pageFlip || node.pageFlip;
                break;
              }
            }
          }
        }

        // If found, setup UI
        if (globalPageFlip && typeof globalPageFlip.flip === 'function') {
          setupUI(globalPageFlip);
        } else {
          // Keep trying
          setTimeout(findPageFlip, 200);
        }
      }

      function setupUI(pageFlip) {
        setupPageIndicator(pageFlip);
        setupBukaMenuButton(pageFlip);
      }

      function setupPageIndicator(pageFlip) {
        const indicatorContainer = document.getElementById('pageIndicator');
        const currentPageEl = document.getElementById('currentPage');
        const totalPagesEl = document.getElementById('totalPages');

        function updateIndicator() {
          try {
            const currentIndex = pageFlip.getCurrentPageIndex();
            const totalPages = pageFlip.getPageCount();
            
            currentPageEl.textContent = currentIndex + 1;
            totalPagesEl.textContent = totalPages;
            indicatorContainer.classList.add('visible');
          } catch (error) {
            console.warn('Error updating page indicator:', error);
          }
        }

        // Listen for page changes
        if (pageFlip.on) {
          pageFlip.on('flip', updateIndicator);
          pageFlip.on('changeOrientation', updateIndicator);
        }

        // Initial update
        setTimeout(updateIndicator, 500);
      }

      function setupBukaMenuButton(pageFlip) {
        const bukaMenuBtn = document.getElementById('bukaMenuBtn');

        function updateButtonVisibility() {
          try {
            const currentIndex = pageFlip.getCurrentPageIndex();
            
            if (currentIndex === 0) {
              bukaMenuBtn.classList.add('visible');
            } else {
              bukaMenuBtn.classList.remove('visible');
            }
          } catch (error) {
            console.warn('Error updating button visibility:', error);
          }
        }

        // Show button initially if on cover
        setTimeout(() => {
          updateButtonVisibility();
        }, 500);

        // Update button visibility when page changes
        if (pageFlip.on) {
          pageFlip.on('flip', updateButtonVisibility);
          pageFlip.on('changeOrientation', updateButtonVisibility);
        }

        // Handle button click
        bukaMenuBtn.addEventListener('click', () => {
          try {
            pageFlip.flip(1);
            bukaMenuBtn.classList.remove('visible');
          } catch (error) {
            console.error('Error flipping page:', error);
          }
        });
      }

      // Start looking for PageFlip
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', findPageFlip);
      } else {
        findPageFlip();
      }
    </script>
  </body>
</html>
